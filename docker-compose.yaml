services:
  seq:
    image: datalust/seq:latest
    container_name: seq-for-api
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=my-password-strong
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data
    
  postgres:
    image: postgres:15
    container_name: postgres-for-api
    environment:
      - POSTGRES_PASSWORD=mystrongpassword
      - POSTGRES_DB=MyApiLogs
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  seq-data:
  postgres-data: